name: Site timer arm

# Short backstop. Starts the site timer if one is not already waiting.
# The timer keeps itself alive overnight and fires the morning preview; these
# crons only restart it if that chain has stopped. 13:20 and 14:20 UTC are
# 9:20 ET in EDT and EST. :50 is a second chance when GitHub drops :20.
# Minutes here are free (this repo stays public).
# Exits immediately if NHL_MODEL_DISPATCH_TOKEN is unset.

on:
  workflow_dispatch:
    inputs:
      auspex_timer:
        description: "From NHL-MODEL. public = this timer may dispatch locks."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "20 13,14 * * *"
    - cron: "50 13,14 * * *"
    - cron: "7 15,19,23 * * *"

permissions:
  contents: read
  actions: write

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the site timer if it is idle
        env:
          GH_TOKEN: ${{ github.token }}
          NHL_MODEL_DISPATCH_TOKEN: ${{ secrets.NHL_MODEL_DISPATCH_TOKEN }}
          AUSPEX_TIMER: ${{ github.event.inputs.auspex_timer || vars.AUSPEX_TIMER }}
          TIMER_CMD: arm
        run: python3 .github/timer.py arm
