name: Site timer arm

# Short backstop. Starts the site timer if one is not already waiting.
# Three times a day, plus when the private repo's morning run dispatches it.
# Exits immediately if NHL_MODEL_DISPATCH_TOKEN is unset.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 15,19,23 * * *"

permissions:
  contents: read
  actions: write

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the site timer if it is idle
        env:
          GH_TOKEN: ${{ github.token }}
          NHL_MODEL_DISPATCH_TOKEN: ${{ secrets.NHL_MODEL_DISPATCH_TOKEN }}
          TIMER_CMD: arm
        run: python3 .github/timer.py arm
