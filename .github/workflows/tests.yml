name: Tests

# Runs the site's small test folder (the visit counter). The bot's timer
# workflows are separate files and are not touched by this one.
on:
  pull_request:
    paths:
      - "web/public/visits.js"
      - "web/app/layout.jsx"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m unittest discover -s tests -v
