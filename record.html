<main class="wrap record" id="content">
  <header class="page-head">
    <p class="kicker" data-c="record.kicker"></p>
    <h1 data-c="record.title"></h1>
    <p class="lede" data-c="record.lede"></p>
  </header>
  <section aria-label="Summary">
    <p class="banner" id="record-empty" data-c="record.empty"></p>
    <div class="kpis" id="record-kpis"></div>
    <div class="figure" id="record-chart"></div>
    <p class="cap" id="record-updated"></p>
  </section>
  <section aria-labelledby="record-table-h">
    <h2 id="record-table-h" data-c="record.tableTitle"></h2>
    <div class="tools" id="record-tools" hidden>
      <label><span data-c="record.showLeague"></span>
        <select id="record-league">
          <option value="all">All</option>
          <option value="NHL">NHL</option>
          <option value="NBA">NBA</option>
        </select>
      </label>
      <label><span data-c="record.showResult"></span>
        <select id="record-result">
          <option value="all">All</option>
          <option value="Won">Won</option>
          <option value="Lost">Lost</option>
          <option value="Push">Push</option>
          <option value="Void">Void</option>
        </select>
      </label>
      <button type="button" class="btn" id="record-csv" data-c="record.csv"></button>
    </div>
    <div class="tablewrap" id="record-wrap" hidden>
      <table id="record-table">
        <caption class="sr" data-c="record.caption"></caption>
        <thead><tr>
          <th data-c="record.colDate"></th>
          <th data-c="record.colLeague"></th>
          <th data-c="record.colMatchup"></th>
          <th data-c="record.colPick"></th>
          <th class="r" data-c="record.colOdds"></th>
          <th class="r" data-c="record.colStake"></th>
          <th data-c="record.colResult"></th>
          <th class="r" data-c="record.colUnits"></th>
          <th class="r" data-c="record.colRunning"></th>
          <th class="r" data-c="record.colRecord"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section aria-labelledby="clv-h">
    <h2 id="clv-h" data-c="record.clvTitle"></h2>
    <p class="lede" id="clv-status" data-c="record.clvMissing"></p>
    <div class="clv-grid" id="clv-blocks"></div>
  </section>
</main>
